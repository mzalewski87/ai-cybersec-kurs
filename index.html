<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AI w cyberbezpieczeństwie — dostęp chroniony</title>
<!-- Celowo bez Google Fonts. Zbudowany CSS Tailwinda nie odwołuje się ani do
     Plus Jakarta Sans, ani do JetBrains Mono (sprawdzone: zero wystąpień), więc
     linki z oryginalnego index.html były martwe. Ich brak czyni stronę w pełni
     samowystarczalną: zero zapytań sieciowych, działa offline z pliku i nie
     sygnalizuje nikomu, że ktoś otworzył materiał. -->
<style id="gate-style">
  /* WAŻNE: wszystkie reguły są zawężone do #gate.
     Tailwind v4 umieszcza swoje style w @layer, a CSS bez warstwy ma wyższy
     priorytet w kaskadzie. Gołe selektory typu "button" czy "input" nadpisałyby
     każdy przycisk aplikacji po odszyfrowaniu. Cały ten arkusz jest dodatkowo
     usuwany ze strony w chwili odblokowania. */
  :root { color-scheme: dark; }
  body.gate-locked { margin:0; background:#020617; }
  #gate { position:fixed; inset:0; z-index:50; display:grid; place-items:center;
          padding:1.5rem; background:#020617; color:#e2e8f0; box-sizing:border-box;
          font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #gate * { box-sizing:border-box; }
  #gate .card { width:100%; max-width:26rem; background:#0f172a; border:1px solid #1e293b;
                border-radius:1rem; padding:2rem; box-shadow:0 25px 50px -12px rgba(0,0,0,.7); }
  #gate h1 { margin:0 0 .4rem; font-size:1.15rem; font-weight:800; color:#fff; }
  #gate .sub { margin:0 0 1.5rem; font-size:.8rem; color:#94a3b8; line-height:1.55; }
  #gate label { display:block; font-size:.7rem; font-weight:700; text-transform:uppercase;
                letter-spacing:.06em; color:#cbd5e1; margin-bottom:.5rem; }
  #gate input { width:100%; padding:.8rem .9rem; border-radius:.7rem; background:#020617;
                border:1px solid #1e293b; color:#fff; font-size:.9rem; font-family:inherit; }
  #gate input:focus { outline:2px solid #06b6d4; outline-offset:2px; border-color:#06b6d4; }
  #gate button { width:100%; margin-top:1rem; padding:.85rem; border:0; border-radius:.7rem;
                 background:#06b6d4; color:#020617; font-weight:800; font-size:.85rem;
                 cursor:pointer; font-family:inherit; }
  #gate button:hover:not(:disabled) { background:#22d3ee; }
  #gate button:disabled { opacity:.55; cursor:progress; }
  #gate .msg { margin-top:.9rem; font-size:.78rem; min-height:1.2rem; line-height:1.5; }
  #gate .err { color:#fda4af; } #gate .info { color:#94a3b8; }
</style>
</head>
<body class="gate-locked bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950">
<div id="root"></div>
<div id="gate">
  <main class="card">
    <h1>AI w cyberbezpieczeństwie</h1>
    <p class="sub">Materiał szkoleniowy o ograniczonym dostępie. Treść jest zaszyfrowana —
       podaj hasło współdzielone, aby ją odszyfrować w przeglądarce.</p>
    <form id="f" autocomplete="off">
      <label for="p">Hasło dostępu</label>
      <input id="p" type="password" autocomplete="current-password" autofocus
             aria-describedby="m" required>
      <button id="b" type="submit">Odszyfruj i otwórz kurs</button>
    </form>
    <p class="msg" id="m" role="status" aria-live="polite"></p>
  </main>
</div>

  var KEY = "cybersec-ai-pass";
  var f = document.getElementById('f'), p = document.getElementById('p'),
      b = document.getElementById('b'), m = document.getElementById('m'),
      gate = document.getElementById('gate');

  function bin(b64s) {
    var s = atob(b64s), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  async function unlock(pass, silent) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bin(DATA.s), iterations: DATA.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    // Nieprawidłowe hasło = błąd weryfikacji tagu GCM, czyli wyjątek.
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(DATA.i) }, key, bin(DATA.c));

    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    var app = JSON.parse(await new Response(stream).text());

    // Kolejność ma znaczenie: najpierw usuwamy arkusz bramki, potem wstawiamy
    // arkusz aplikacji. Style bramki są poza @layer, więc pozostawione
    // przebiłyby utility Tailwinda i rozjechały cały interfejs.
    var gs = document.getElementById('gate-style');
    if (gs) gs.remove();
    document.body.classList.remove('gate-locked');
    gate.remove();

    if (app.css) {
      var st = document.createElement('style');
      st.textContent = app.css;
      document.head.appendChild(st);
    }
    document.title = 'AI w cyberbezpieczeństwie: Przewodnik sprzedażowy';
    // Zwykły skrypt z treścią, nie moduł z blob: URL. Moduły ES pobiera się
    // z użyciem CORS, więc przy otwarciu z pliku (file://, origin opaque)
    // przeglądarka odmówiłaby ich wczytania i paczka offline by nie działała.
    var sc = document.createElement('script');
    sc.textContent = app.js;
    document.body.appendChild(sc);
    try { sessionStorage.setItem(KEY, pass); } catch (e) {}
    if (silent) {} // bez komunikatu przy automatycznym odblokowaniu
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    b.disabled = true;
    m.className = 'msg info';
    m.textContent = 'Odszyfrowywanie… to potrwa chwilę (celowo kosztowne wyliczanie klucza).';
    try {
      await unlock(p.value, false);
    } catch (err) {
      b.disabled = false;
      m.className = 'msg err';
      m.textContent = 'Nieprawidłowe hasło.';
      p.select();
    }
  });

  // Odblokowanie na czas trwania karty przeglądarki, żeby nie wpisywać hasła
  // przy każdym odświeżeniu. Zamknięcie karty czyści sessionStorage.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    m.className = 'msg info';
    m.textContent = 'Przywracanie sesji…';
    unlock(saved, true).catch(function () {
      try { sessionStorage.removeItem(KEY); } catch (e) {}
      m.textContent = '';
    });
  }
})();
